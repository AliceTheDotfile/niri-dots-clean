# ============================================================
# CLEAN MINIMAL HYPRLOCK
# ============================================================

general {
    hide_cursor = true
    disable_loading_bar = true
    immediate_render = true
    no_fade_in = false
    no_fade_out = false
    grace = 0
    ignore_empty_input = false
}

# ============================================================
# BACKGROUND
# ============================================================

background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 10

    brightness = 0.65
    contrast = 0.90

    noise = 0.0
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# ============================================================
# PASSWORD FIELD
# ============================================================

input-field {
    monitor =

    size = 300, 48

    position = 0, 0
    halign = center
    valign = center

    # sharp square box
    rounding = 0

    outline_thickness = 2
    outer_color = rgba(70, 133, 239, 0.80)

    # transparent-ish dark interior
    inner_color = rgba(20, 28, 43, 0.55)

    font_color = rgba(238, 239, 241, 0.95)
    font_family = JetBrains Mono

    # circular password dots
    dots_size = 0.20
    dots_spacing = 0.20
    dots_center = true
    dots_rounding = -1

    # show nothing when empty
    fade_on_empty = false
    placeholder_text =
    fail_text =

    hide_input = false

    check_color = rgba(94, 141, 222, 0.95)
    fail_color = rgba(69, 125, 221, 0.95)
}
